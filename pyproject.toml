[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-research"
version = "0.1.0"
description = "Independent implementation of the PACE single-level scoring rule"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "jax==0.4.35",
    "jaxlib==0.4.35",
    "numpy==1.26.4",
]

[project.optional-dependencies]
maze = [
    "jaxued[examples] @ git+https://github.com/DramaCow/jaxued.git@0f8f1284677375b889e4f13a32c9617cd009f8c4",
    "flax==0.10.2",
    "optax==0.2.4",
    "chex==0.1.88",
    "gymnax==0.0.8",
    "distrax==0.1.5",
    "tensorflow-probability==0.25.0",
    "orbax-checkpoint==0.5.3",
    "wandb==0.19.1",
    "moviepy==1.0.3",
]
test = ["pytest==8.3.5"]
kaggle = ["jax-cuda12-plugin[with-cuda]==0.4.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
